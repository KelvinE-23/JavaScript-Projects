<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>React Setup</title>

        <!-- React Core Library -->
        <script src="https://unpkg.com/react@16/umd/react.development.js" crossorigin></script>

        <!-- React DOM Library -->
        <script src="https://unpkg.com/react-dom@16/umd/react-dom.development.js" crossorigin></script>

        <!-- Babel (JSX Compiler for Browser) -->
        <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

        <!-- Custom Styles using vw and fade-in -->
        <style>
            body {
                margin: 0;
            }

            /* Fade-in animation using keyframes */
            @keyframes fadeIn {
                from {
                    opacity: 0;
                    transform: translateY(20px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }

            #JSX {
                animation: fadeIn 1.5s ease-in-out;
            }

            h1 {
                font-size: 5vw;
                text-align: center;
            }


            .form-popup {
                display: none; 
                position: fixed;
                z-index: 999;
                left: 0;
                top: 0;
                width: 100%;
                height: 100%;
                background-color: rgba(0,0,0,0.6);
            }

            .form-container {
                background-color: white;
                width: 300px;
                padding: 20px;
                border-radius: 5px;
                position: relative;
                margin: 10% auto;
                animation: fadeIn 0.4s ease-in-out;
            }

            .close-btn {
                position: absolute;
                top: 10px;
                right: 15px;
                cursor: pointer;
                font-size: 20px;
            }

            @keyframes fadeIn {
                from { opacity: 0; transform: scale(0.9); }
                to { opacity: 1; transform: scale(1); }
            }


        </style>

    </head>

    <!--form field with js validator and React component -->
    <body>

        <div id="JSX"></div>

        <script type="text/babel">
            class Greeting extends React.Component {
                render() {
                    return <h1>Hello, World!</h1>
                }
            }

            ReactDOM.render(<Greeting />, document.getElementById('JSX'))
        </script>

        <form id="contactForm">
            <label for="phone">Phone Number:</label><br>
            <input type="tel" id="phone" name="phone"><br><br>
            <input type="submit" value="Submit">
        </form>

        <script>
            document.getElementById("contactForm").addEventListener("submit", function(event) {
                var phoneField = document.getElementById("phone").value;

                if (phoneField.trim() === "") {
                    alert("Phone number cannot be empty.");
                    event.preventDefault();
                }
            });
        </script>

        <script>
            function openForm() {
            document.getElementById("popupForm").style.display = "block";
            }

            function closeForm() {
            document.getElementById("popupForm").style.display = "none";
            }

            // Close if clicking outside form
            window.onclick = function(event) {
            const popup = document.getElementById("popupForm");
            if (event.target === popup) {
            popup.style.display = "none";
            }
            };

            // Form validation
            document.getElementById("popupContactForm").addEventListener("submit", function(event) {
            const phoneValue = document.getElementById("popupPhone").value;

            if (phoneValue.trim() === "") {
            alert("Phone number cannot be empty.");
            event.preventDefault();
            }
            });
        </script>

        <button onclick="openForm()">Contact Us</button>

            <div id="popupForm" class="form-popup">
                <div class="form-container">
                    <span class="close-btn" onclick="closeForm()">×</span>

                    <h2>Contact Form</h2>

                    <form id="popupContactForm">
                        <label for="popupPhone">Phone Number:</label><br>
                        <input type="tel" id="popupPhone"><br><br>

                        <input type="submit" value="Submit">
                    </form>
                </div>
            </div>

    </body>
</html>
