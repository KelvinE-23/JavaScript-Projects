<!DOCTYPE html>
<html>
    <head>
        <title>JavaScript P9 countdown</title>
        <link rel="stylesheet" href="./CSS/main.css">
        
        
    </head>
    <body>
        <p>How many seconds would you like to set your alarm for?</p>
        <input id="seconds" value="" />
        <button onclick="countdown()">Click here</button>
        <p id="timer"></p>

        <h2 id="alarms">If you had no phone which alarm would you choose?</h2>

        <!-- Slideshow container -->
        <div class="slideshow-container">

        <!-- Full-width images with number and caption text -->
        <div class="mySlides fade">
            <div class="numbertext">1 / 4</div>
            <img src="./Img/rooster.jpg" style="width:100%">
            <div class="text">Rooster</div>
        </div>

        <div class="mySlides fade">
            <div class="numbertext">2 / 4</div>
            <img src="./Img/platowateralarm.jpg" style="width:100%">
            <div class="text">Plato's water alarm</div>
        </div>

        <div class="mySlides fade">
            <div class="numbertext">3 / 4</div>
            <img src="./Img/bell.jpg" style="width:100%">
            <div class="text">Church bell</div>
        </div>

        <div class="mySlides fade">
            <div class="numbertext">4 / 4</div>
            <img src="./Img/alarmclock.jpg" style="width:100%">
            <div class="text">Alarm clock</div>
        </div>

        <!-- Next and previous buttons -->
        <a class="prev" onclick="plusSlides(-1)">&#10094;</a>
        <a class="next" onclick="plusSlides(1)">&#10095;</a>
        </div>
        <br>

        <!-- The dots/circles -->
        <div style="text-align:center">
        <span class="dot" onclick="currentSlide(1)"></span>
        <span class="dot" onclick="currentSlide(2)"></span>
        <span class="dot" onclick="currentSlide(3)"></span>
        </div>
    
        <script src="./JS/main.js"></script>
    </body>

</html>
